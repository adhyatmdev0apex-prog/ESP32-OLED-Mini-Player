[platformio]
default_envs = esp32dev, esp32dev_psram, esp32cam

[env:esp32dev]
platform = espressif32@6.3.2
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 460800

board_build.filesystem = littlefs
board_build.partitions = partitions.csv

build_flags =
    -DTARGET_ESP32DEV_NO_PSRAM

lib_deps =
    olikraus/U8g2
    https://github.com/pschatzmann/ESP32-A2DP.git#main
    bblanchon/ArduinoJson@^6.21.3

[env:esp32dev_psram]
platform = espressif32@6.3.2
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 460800

board_build.filesystem = littlefs
board_build.partitions = partitions.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DTARGET_ESP32DEV_PSRAM

lib_deps =
    olikraus/U8g2
    https://github.com/pschatzmann/ESP32-A2DP.git#main
    bblanchon/ArduinoJson@^6.21.3

[env:esp32cam]
platform = espressif32@6.3.2
board = esp32cam
framework = arduino

monitor_speed = 115200
upload_speed = 460800

board_build.filesystem = littlefs
board_build.partitions = partitions.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DTARGET_ESP32CAM

lib_deps =
    olikraus/U8g2
    https://github.com/pschatzmann/ESP32-A2DP.git#main
    bblanchon/ArduinoJson@^6.21.3
